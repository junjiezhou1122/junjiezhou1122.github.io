{% assign locale = site.data.locales[page.lang] %}
<dialog id="wechat-qr-dialog" class="wechat-dialog" aria-labelledby="wechat-dialog-title">
  <div class="wechat-dialog-content">
    <button id="wechat-dialog-close" class="wechat-dialog-close" type="button" aria-label="{{ locale.qr_close }}">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="m4 4 8 8M4 12l8-8" />
      </svg>
    </button>
    <p class="dialog-kicker">{{ locale.connect }}</p>
    <h2 id="wechat-dialog-title">{{ locale.wechat }}</h2>
    <p>{{ locale.qr_note }}</p>
    <img data-src="{{ '/assets/img/wechat-qr.JPG' | relative_url }}" alt="{{ locale.qr_alt }}" width="888" height="1191">
  </div>
</dialog>
